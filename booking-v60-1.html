<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動物醫院線上預約</title>
<style>body{margin:0;background:#f1f6f5;color:#203b36;font:16px system-ui,sans-serif}main{max-width:560px;margin:30px auto;padding:24px;background:white;border-radius:16px;box-shadow:0 4px 20px #173d3410}h1{font-size:24px;margin-top:0}label{display:block;margin:16px 0 6px;font-weight:600}input,select,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #b8cbc5;border-radius:8px}textarea{min-height:85px}button{background:#176b57;color:white;border:0;cursor:pointer;margin-top:16px}button:disabled{opacity:.5;cursor:default}.notice{background:#edf6f2;padding:14px;border-radius:8px;line-height:1.7}.small{font-size:14px;color:#546a64}#message{white-space:pre-wrap;line-height:1.7}.check{display:flex;align-items:flex-start;gap:8px;font-weight:400}.check input{width:auto;margin-top:5px}.trap{position:absolute;left:-10000px}#success{background:#edf6f2;padding:18px;border-radius:12px}a{color:#176b57}@media(max-width:600px){main{margin:12px;padding:20px}}</style>
<main><h1 id="title">線上預約</h1><p class="notice" id="notice">正在讀取可預約時段…</p><p id="message" role="status" aria-live="polite"></p>
<form id="form" hidden><p class="notice">每半小時限1位，送出後先保留名額，待院方確認。當天上午可約下午／晚上，下午可約晚上；晚上請約隔天以後。至少提前1小時。院方確認後會另行聯絡您。</p><label for="booking-date">預約日期（台灣時間）</label><input id="booking-date" type="date" required><p id="date-hint" class="small"></p><label for="slot">預約時間（每格 30 分鐘）</label><select id="slot" required></select>
<label for="name">聯絡人姓名</label><input id="name" autocomplete="name" maxlength="100" required>
<label for="phone">聯絡電話</label><input id="phone" type="tel" autocomplete="tel" maxlength="30" required placeholder="方便醫院聯絡您的電話">
<label for="pet">寵物名字</label><input id="pet" maxlength="100" required>
<label for="species">寵物種類</label><select id="species"><option>犬</option><option>貓</option><option>其他</option></select>
<label for="reason">預約原因</label><textarea id="reason" maxlength="1000" placeholder="簡單描述即可，請勿填寫身分證字號等資料"></textarea>
<div class="trap" aria-hidden="true"><label>網站<input id="website" tabindex="-1" autocomplete="off"></label></div>
<label class="check"><input id="consent" type="checkbox" required><span>同意醫院使用上述資料處理本次預約與聯絡。此申請須經醫院確認，急症請直接聯絡醫院。</span></label>
<div id="captcha"></div><button id="submit" type="submit" disabled>送出預約申請</button><p class="small">送出後請保留申請編號。確認後由院方聯絡；本頁不會自動傳送 LINE 或簡訊。</p></form><section id="success" hidden></section></main>
<script>
'use strict';
// 僅有公開函式網址；無管理金鑰或員工帳號。
const API='https://rfprsbftkwtwjqrjcalq.supabase.co/functions/v1/online-booking';
const clinic=new URLSearchParams(location.search).get('clinic')||'genblue-ah';
const $=id=>document.getElementById(id);let token='',widget=null,busy=false,lastFingerprint='',requestID='';let availableSlots=[];
const dateLabel=x=>new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(x));
function turnstileReady(){widget=turnstile.render('#captcha',{sitekey:window.bookingSiteKey,action:'booking',callback:t=>{token=t;$('submit').disabled=busy;},'expired-callback':()=>{token='';$('submit').disabled=true;},'error-callback':()=>{token='';$('submit').disabled=true;$('message').textContent='驗證未完成，請重新整理後再試。';}});}
async function load(){try{const r=await fetch(API+'?clinic='+encodeURIComponent(clinic),{signal:AbortSignal.timeout(15000)});const d=await r.json();if(!r.ok)throw Error(d.error||'無法讀取時段');$('title').textContent=d.name+'｜線上預約';$('notice').textContent=d.notice;
 if(!d.slots.length){$('message').textContent='目前沒有可預約時段，請直接聯絡醫院。';return;}
 availableSlots=d.slots;
 const days=[...new Set(d.slots.map(s=>taiwanDay(s.starts_at)))].sort();
 $('booking-date').min=days[0];$('booking-date').max=days.at(-1);$('booking-date').value=days[0];renderTimes();

 $('form').hidden=false;window.bookingSiteKey=d.site_key;const script=document.createElement('script');script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?onload=turnstileReady&render=explicit';script.async=true;script.onerror=()=>{$('message').textContent='驗證服務無法載入，請稍後再試。';};document.head.append(script);
 }catch(e){$('notice').textContent='目前無法使用線上預約';$('message').textContent=e.message+'。請聯絡醫院。';}}
function taiwanDay(x){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(x));return ['year','month','day'].map(k=>p.find(v=>v.type===k).value).join('-');}
function renderTimes(){const slots=availableSlots.filter(s=>taiwanDay(s.starts_at)===$('booking-date').value);$('slot').replaceChildren(new Option('請選擇時間',''));for(const s of slots)$('slot').append(new Option(dateLabel(s.starts_at)+'（尚有 '+s.remaining+' 個名額）',s.id));$('date-hint').textContent=slots.length?'請選擇下方時間；送出後需由醫院確認。':'這天休診、已額滿或未開放，請改選其他日期。';}
$('booking-date').onchange=renderTimes;
$('form').onsubmit=async e=>{e.preventDefault();if(busy||!token)return;busy=true;$('submit').disabled=true;$('message').textContent='正在送出，請稍候…';
 const draft={clinic,slot_id:$('slot').value,name:$('name').value.trim(),phone:$('phone').value.trim(),pet_name:$('pet').value.trim(),species:$('species').value,reason:$('reason').value.trim()};
 const fingerprint=JSON.stringify(draft);if(lastFingerprint!==fingerprint){requestID=crypto.randomUUID();lastFingerprint=fingerprint;}
 try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...draft,request_id:requestID,token,consent:$('consent').checked,website:$('website').value}),signal:AbortSignal.timeout(20000)});const d=await r.json();if(!r.ok)throw Error(d.error||'送出失敗');
 $('form').hidden=true;$('message').textContent='';$('success').hidden=false;$('success').textContent=(d.status==='approved'?'醫院已確認此申請。':d.status==='rejected'?'此申請已由醫院取消，請聯絡醫院。':'已收到申請，尚待醫院確認。')+'\n申請編號：'+d.reference+'\n時段：'+$('slot').selectedOptions[0].textContent+'\n請保留此畫面，醫院將以電話聯絡；尚未確認前不代表已完成預約。';$('success').style.whiteSpace='pre-wrap';
 }catch(e){$('message').textContent=e.message+'。若網路中斷，請保留原內容重試；同一份申請重試不會重複建立。';}
 finally{busy=false;token='';if(widget!==null)turnstile.reset(widget);$('submit').disabled=true;}};
load();
</script></html>
